
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundSync | Music Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#" class="logo">♫ SoundSync</a>
        <nav>
            <a href="#home">Home</a>
            <a href="#library">Music Library</a>
            <a href="#add-song">Add Song</a>
        </nav>
    </header>

    <main class="container" id="home">
        <section class="hero">
            <div>
                <p class="eyebrow">YOUR MUSIC, YOUR WORLD</p>
                <h1>Feel the beat.<br>Find your sound.</h1>
                <p class="subtitle">
                    Discover your favorite tracks in one place.
                </p>
                <a href="#library" class="btn">Explore Music</a>
            </div>
            <div class="music-art">♫</div>
        </section>

        <section id="library" class="section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR COLLECTION</p>
                    <h2>Music Library</h2>
                </div>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search songs or artists..."
                    aria-label="Search songs or artists"
                >
            </div>

            <p id="statusMessage" role="status">Loading songs...</p>
            <div id="songList" class="song-grid"></div>
        </section>

        <section id="add-song" class="section">
            <p class="eyebrow">GROW YOUR PLAYLIST</p>
            <h2>Add a New Song</h2>

            <form id="songForm" class="song-form">
                <label for="title">Song Title</label>
                <input id="title" name="title"
                       placeholder="Enter song title" required>

                <label for="artist">Artist</label>
                <input id="artist" name="artist"
                       placeholder="Enter artist name" required>

                <label for="album">Album</label>
                <input id="album" name="album"
                       placeholder="Enter album name">

                <label for="genre">Genre</label>
                <input id="genre" name="genre"
                       placeholder="e.g. Pop, Rock, R&B">

                <label for="duration">Duration (seconds)</label>
                <input id="duration" name="duration" type="number"
                       min="1" placeholder="e.g. 210">

                <label for="cover_url">Cover Image URL (optional)</label>
                <input id="cover_url" name="cover_url" type="url"
                       placeholder="https://example.com/cover.jpg">

                <button type="submit" class="btn">Add Song</button>
                <p id="formMessage" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 SoundSync — Your music, in sync.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
